<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Hair Salon Party</title>
  <meta name="description" content="Cut, colour, curl, wash, add glasses and style hair for friendly customers and a monster!">
  <meta name="theme-color" content="#e84c8a">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hair Salon">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <!-- HOME SCREEN -->
  <section id="scrHome" class="screen active" aria-label="Home">
    <header class="home-header">
      <div class="brand-title">
        <span style="font-size:34px">💇‍♀️</span>
        <h1>Hair Salon Party</h1>
      </div>
      <div class="home-actions">
        <button id="installBtn" class="btn btn-primary" hidden>📲 Download App</button>
        <button id="updateBtn" class="btn btn-update" title="Check for app updates">Update</button>
        <button id="openLookbookBtn" class="btn btn-accent">📸 Photos</button>
        <button id="muteBtnHome" class="icon-btn" aria-label="Toggle sound">🔊</button>
      </div>
    </header>

    <main class="home-body">
      <p class="home-subtitle">Tap a customer to start styling! ✨</p>
      <div id="customerGrid" class="customer-grid"></div>
    </main>
  </section>

  <!-- SALON SCREEN -->
  <section id="scrSalon" class="screen" aria-label="Salon Chair">
    <header class="salon-top">
      <div class="salon-top-left">
        <button id="backHomeBtn" class="icon-btn" aria-label="Back to customers" title="Customers">🏠</button>
        <h2 id="salonCustomerName" class="salon-title">Maya</h2>
      </div>
      <div class="salon-top-right">
        <button id="undoBtn" class="icon-btn" aria-label="Undo" title="Undo">↩️</button>
        <button id="resetBtn" class="icon-btn" aria-label="Reset hair" title="Reset">🔄</button>
        <button id="muteBtnSalon" class="icon-btn" aria-label="Toggle sound" title="Sound">🔊</button>
        <button id="snapPhotoBtn" class="btn btn-primary">📸 Photo!</button>
      </div>
    </header>

    <div class="salon-workspace">
      <!-- Left Station Dock -->
      <nav class="station-dock" aria-label="Salon Stations">
        <button class="station-btn active" data-station="cut">
          <span class="ico">✂️</span><span class="lbl">Cut</span>
        </button>
        <button class="station-btn" data-station="color">
          <span class="ico">🎨</span><span class="lbl">Colour</span>
        </button>
        <button class="station-btn" data-station="style">
          <span class="ico">💇‍♀️</span><span class="lbl">Style</span>
        </button>
        <button class="station-btn" data-station="wash">
          <span class="ico">🚿</span><span class="lbl">Wash</span>
        </button>
        <button class="station-btn" data-station="glasses">
          <span class="ico">👓</span><span class="lbl">Glasses</span>
        </button>
        <button class="station-btn" data-station="extras">
          <span class="ico">🎀</span><span class="lbl">Extras</span>
        </button>
        <button class="station-btn" data-station="backdrop">
          <span class="ico">🌈</span><span class="lbl">Scene</span>
        </button>
      </nav>

      <!-- Center Hair Canvas -->
      <div class="stage-wrap">
        <canvas id="salonCanvas"></canvas>
      </div>

      <!-- Right Tool / Swatch Tray -->
      <aside id="optionTray" class="option-tray" aria-label="Tool Options"></aside>
    </div>
  </section>

  <!-- LOOKBOOK GALLERY SCREEN -->
  <section id="scrGallery" class="screen" aria-label="Photo Lookbook">
    <header class="salon-top">
      <div class="salon-top-left">
        <button id="galBackBtn" class="icon-btn" aria-label="Back">⬅️</button>
        <h2 class="salon-title">📸 Salon Photos</h2>
      </div>
      <div class="salon-top-right"></div>
    </header>
    <main class="gal-body">
      <div id="galEmpty" class="gal-empty" hidden>No photos yet! Tap 📸 Photo! in the salon to save a look.</div>
      <div id="galGrid" class="gal-grid"></div>
    </main>
  </section>

  <!-- PHOTO VIEWER MODAL -->
  <div id="viewerModal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <img id="viewerImg" alt="Salon portrait">
      <div id="viewerMeta" style="font-weight:800; color:var(--ink-soft);"></div>
      <div class="modal-row">
        <a id="viewerDl" class="btn btn-mint" download="hair-salon.jpg">⬇️ Save</a>
        <button id="viewerDel" class="btn btn-danger">🗑️ Delete</button>
        <button id="viewerClose" class="btn btn-soft">✖️ Close</button>
      </div>
    </div>
  </div>

  <!-- iOS INSTALL MODAL -->
  <div id="iosModal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h2 style="margin:0;">📲 Add to Home Screen</h2>
      <p style="text-align:center; margin:0; color:var(--ink-soft);">
        Tap the <strong>Share</strong> button in your browser, then tap <strong>Add to Home Screen</strong>.
      </p>
      <button id="iosClose" class="btn btn-primary">Got it!</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
